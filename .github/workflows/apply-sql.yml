name: تطبيق SQL على القاعدة
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'مسار ملف الترحيل داخل المستودع'
        required: true
        default: 'supabase/045_profile_public.sql'
permissions:
  contents: read
concurrency:
  group: apply-sql
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تثبيت عميل PostgreSQL 17 (نفس نمط النسخ الاحتياطي الليلي)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq wget ca-certificates gnupg
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/pgdg.gpg
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client-17
      - name: تطبيق ملف الترحيل
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "${{ github.event.inputs.file }}"
      - name: تحقق — الدالة موجودة وصلاحيات anon ممنوحة
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -c "select proname, proacl is not null as has_acl from pg_proc where proname = 'profile_public_by_username';"
          psql "$SUPABASE_DB_URL" -c "select column_name from information_schema.columns where table_name='profiles' and column_name='cover_url';"
